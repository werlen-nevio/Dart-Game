version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dart-party-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:./data/prod.db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ORIGIN: http://localhost
    volumes:
      - backend-data:/app/data
    networks:
      - dart-party-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dart-party-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dart-party-network

volumes:
  backend-data:

networks:
  dart-party-network:
    driver: bridge
